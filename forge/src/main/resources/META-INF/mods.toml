modLoader="javafml"
loaderVersion="[46,)"
issueTrackerURL="https://github.com/MOPELotus/ModernUI-MC-Lumen/issues"
logoFile= "modernui_logo.png"
license="LGPL-3.0-or-later"

[[mods]]
    modId="modernui"
    version="${version}"
    displayName="${display_name}"
    displayURL="https://github.com/MOPELotus/ModernUI-MC-Lumen"
    displayTest="IGNORE_ALL_VERSION"
    authors="BloCamLimb, MOPELotus"
    description='''
    ModernUI Lumen is an independently maintained fork of Modern UI for Minecraft by BloCamLimb. Maintained by MOPELotus, it provides the ModernUI framework integration, enhanced text rendering and UI features for Minecraft. This fork is not an official upstream release.
    '''

[[dependencies.modernui]]
    modId="forge"
    mandatory=true
    versionRange="[56.0.9,)"
    ordering="NONE"
    side="BOTH"
[[dependencies.modernui]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.21.6, 1.21.9)"
    ordering="NONE"
    side="BOTH"

name: CurseForge 只读检查
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false
      - name: 检查 Token 和所需版本标签，不上传
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, re
          spec = importlib.util.spec_from_file_location('cf', 'scripts/curseforge.py')
          cf = importlib.util.module_from_spec(spec); spec.loader.exec_module(cf)
          assert re.fullmatch(r'[1-9]\d*', os.environ['CURSEFORGE_PROJECT_ID'])
          assert os.environ['CURSEFORGE_TOKEN'], 'Missing token'
          plan = cf.load_plan('release/curseforge-targets.json')
          labels = cf.api_json('/game/versions', os.environ['CURSEFORGE_TOKEN'])
          rows = [{'game_versions': t['game_versions']} for t in plan['targets']]
          try:
              print('Version type diagnostic:', cf.api_json('/game/version-types', os.environ['CURSEFORGE_TOKEN']))
          except RuntimeError as error:
              print('Version type endpoint unavailable:', str(error))
          names = {v for r in rows for v in r['game_versions']} | {'Fabric', 'NeoForge', 'Client'}
          for name in sorted(names):
              print('Label diagnostic', name, [v for v in labels if v.get('name') == name])
          print('Response entries:', len(labels), 'sample:', labels[:3])
          print('Required version labels:', cf.resolve_versions(labels, rows))
          print('Read-only token/labels check passed; project upload permission is not tested by this GET.')
          PY

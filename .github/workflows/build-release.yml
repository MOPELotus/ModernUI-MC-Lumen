name: Build

on:
  push:
    branches:
      - '1.21.1'
  pull_request:
    branches:
      - '1.21.1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build configured loaders
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and collect both font editions
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          mkdir -p release
          for variant in standard misans; do
            ./gradlew --no-daemon clean build -Pfont_variant="$variant"
            suffix=universal
            if [[ "$variant" == misans ]]; then suffix=universal-misans; fi
            for loader in fabric neoforge; do
              jars=("$loader"/build/libs/ModernUI-Lumen-*-"$suffix".jar)
              [[ ${#jars[@]} -eq 1 && -f "${jars[0]}" ]]
              cp -- "${jars[0]}" release/
            done
          done
          python3 scripts/check-release-variants.py release fabric neoforge
          ls -lh release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: modernui-lumen-release-jars
          path: release/*.jar
          if-no-files-found: error

pluginManagement {
    repositories {
        maven {
            url 'https://maven.minecraftforge.net/'
        }
        maven {
            url 'https://maven.neoforged.net/releases/'
        }
        maven {
            url 'https://maven.fabricmc.net/'
        }
        maven {
            url 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            url 'https://repo.codemc.io/repository/relativitymc/'
        }
        gradlePluginPortal()
    }
}

rootProject.name = 'ModernUI-MC'

include 'common'

def platformNames = [neoforge: 'NeoForge', fabric: 'Fabric']
providers.gradleProperty('enabled_platforms').getOrElse('fabric,neoforge')
        .split(',').collect { it.trim() }.each { platform ->
    if (!platformNames.containsKey(platform)) {
        throw new GradleException("Unknown platform: ${platform}")
    }
    include platform
    project(":${platform}").name = "ModernUI-${platformNames[platform]}"
}

plugins {
    id 'org.relativitymc.neo-loom'
}

loom {
    accessWidenerPath = file("src/main/resources/modernui.classtweaker")
}

repositories {
    maven {
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        url 'https://maven.izzel.io/releases/'
    }
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly 'org.spongepowered:mixin:0.8.7'
    compileOnly 'org.ow2.asm:asm-tree:9.8'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
    testImplementation 'org.ow2.asm:asm-commons:9.8'
    testRuntimeOnly 'org.spongepowered:mixin:0.8.7'

    implementation("dev.icyllis:modernui-core:${core_version}")
    implementation("icyllis.modernui:ModernUI-Markflow:3.12.0") {
        transitive = false
    }

    compileOnly("org.lwjgl:lwjgl-vulkan:3.4.1")
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register('checkTextMarquee', JavaExec) {
    group = 'verification'
    description = 'Checks continuous text movement, filtering and Canvas cache reuse without a GPU.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.TextMarqueeCheck'
    systemProperty 'modernui.projectRoot', rootProject.projectDir.absolutePath
}

check.dependsOn checkTextMarquee

// A task-backed source directory also supplies the dependency to loader compiles,
// which compile the common sources directly.
def generateFontVariant = tasks.register('generateFontVariant') {
    def output = layout.buildDirectory.dir('generated/sources/fontVariant/java')
    inputs.property('fontVariant', rootProject.fontVariant)
    inputs.property('fontVariantDisplayName', rootProject.fontVariantDisplayName)
    outputs.dir(output)
    doLast {
        def target = output.get().file('icyllis/modernui/mc/FontVariant.java').asFile
        target.parentFile.mkdirs()
        target.text = """package icyllis.modernui.mc;

/** Build-time edition; never selected by a runtime property or config file. */
public final class FontVariant {
    public static final boolean MISANS = ${rootProject.fontVariant == 'misans'};
    public static final String NAME = "${rootProject.fontVariant}";
    public static final String DISPLAY_NAME = "${rootProject.fontVariantDisplayName}";
    public static final String CLIENT_CONFIG_NAME = "client-${rootProject.fontVariant}.toml";
    private FontVariant() {}
}
"""
    }
}
sourceSets.main.java.srcDir(generateFontVariant)

tasks.register('checkFontVariant', JavaExec) {
    group = 'verification'
    description = 'Checks font defaults, legacy configuration isolation and compiled edition boundaries.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.FontVariantCheck'
}
check.dependsOn checkFontVariant

['ClampingScrollView', 'GlfwInput', 'TooltipUniform', 'NativeVulkanContract', 'PackMetadata', 'SoundVolumeContract', 'SpirvArrayLayout', 'NativeVulkanUpload'].each { checkName ->
    def checkTask = tasks.register("check${checkName}", JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "icyllis.modernui.mc.test.${checkName}Check"
        systemProperty 'modernui.projectRoot', rootProject.projectDir.absolutePath
        if (checkName == 'SpirvArrayLayout') {
            args providers.gradleProperty('spirv_fixture_dir').getOrElse(
                    rootProject.layout.buildDirectory.dir('spirv-validation-fixtures').get().asFile.absolutePath)
            if (providers.gradleProperty('spirv_validator').isPresent()) {
                systemProperty 'modernui.spirvValidator', providers.gradleProperty('spirv_validator').get()
            }
        }
        if (checkName == 'SoundVolumeContract') {
            doFirst {
                def neoProject = rootProject.findProject(':ModernUI-NeoForge')
                if (neoProject != null) {
                    def patchedMinecraft = neoProject.tasks.named('compileJava').get().classpath.files.findAll {
                        it.name.startsWith('nfrt-') && it.name.contains('minecraft-merged-') && it.name.endsWith('.jar')
                    }
                    if (patchedMinecraft.empty) throw new GradleException('Missing actual NeoForge patched Minecraft for audio verification')
                    setArgs(patchedMinecraft.collect { it.absolutePath })
                }
            }
        }
    }
    check.dependsOn checkTask
}

tasks.register('checkWindowMode', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.WindowModeCheck'
    doFirst {
        def minecraftJar = configurations.compileClasspath.files.find { jar ->
            jar.name.endsWith('.jar') && new java.util.jar.JarFile(jar).withCloseable { archive ->
                archive.getJarEntry('net/minecraft/client/Minecraft.class') != null
            }
        }
        if (minecraftJar == null) throw new GradleException('Missing actual Minecraft JAR for window transition verification')
        def targets = [minecraftJar.absolutePath]
        if (project.hasProperty('window_runtime_jar')) targets.add(project.property('window_runtime_jar'))
        setArgs(targets)
    }
}
check.dependsOn checkWindowMode

tasks.register('checkPreferredFontIdentifier', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.PreferredFontIdentifierCheck'
    if (project.hasProperty('preferred_font_previous_jar')) {
        args project.property('preferred_font_previous_jar')
    }
}
check.dependsOn checkPreferredFontIdentifier

tasks.register('checkGuiFrameConsumer', JavaExec) {
    group = 'verification'
    description = 'Resolves the compiled above-screen frame consumer against actual Minecraft bytecode.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.GuiFrameConsumerCheck'
    doFirst {
        def minecraftJar = configurations.compileClasspath.files.find { jar ->
            jar.name.endsWith('.jar') && new java.util.jar.JarFile(jar).withCloseable { archive ->
                archive.getJarEntry('net/minecraft/client/Minecraft.class') != null
            }
        }
        if (minecraftJar == null) throw new GradleException('Missing actual Minecraft JAR for GUI frame consumer verification')
        def targets = [minecraftJar.absolutePath]
        if (project.hasProperty('gui_consumer_previous_jar')) targets.add(project.property('gui_consumer_previous_jar'))
        setArgs(targets)
    }
}
check.dependsOn checkGuiFrameConsumer

['SpirvArrayLayout', 'VulkanDepthBarrier', 'VulkanSurface', 'VulkanAcquire', 'VulkanContextLifecycle', 'VulkanGpuOwnership', 'VulkanPipelineLifecycle', 'VulkanImageUploadBarrier', 'VulkanEncoderOwnership'].each { checkName ->
    def checkTask = tasks.register("check${checkName}", JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "icyllis.modernui.mc.test.${checkName}Check"
        if (checkName in ['VulkanDepthBarrier', 'VulkanSurface', 'VulkanAcquire', 'VulkanGpuOwnership', 'VulkanPipelineLifecycle', 'VulkanImageUploadBarrier', 'VulkanEncoderOwnership']) {
            doFirst {
                def vulkanJars = configurations.compileClasspath.files.findAll {
                    it.name.toLowerCase(java.util.Locale.ROOT).contains('vulkanmod') && it.name.endsWith('.jar')
                }
                if (vulkanJars.empty) throw new GradleException('Missing VulkanMod API JAR for injection verification')
                setArgs(vulkanJars.collect { it.absolutePath })
            }
        }
    }
    check.dependsOn checkTask
}


plugins {
    id 'dev.architectury.loom'
}

loom {
    accessWidenerPath = file("src/main/resources/modernui.accesswidener")
}

repositories {
    maven {
        url 'https://repo.spongepowered.org/repository/maven-public/'
    }
    maven {
        url 'https://maven.izzel.io/releases/'
    }
    mavenLocal()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    compileOnly 'org.spongepowered:mixin:0.8.7'
    testImplementation 'org.spongepowered:mixin:0.8.7'
    compileOnly 'org.ow2.asm:asm-tree:9.8'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
    testImplementation 'org.ow2.asm:asm-commons:9.8'
    testImplementation 'org.ow2.asm:asm-analysis:9.8'

    implementation("dev.icyllis:modernui-core:${core_version}")
    implementation("icyllis.modernui:ModernUI-Markflow:3.12.0") {
        transitive = false
    }

    compileOnly("org.lwjgl:lwjgl-vulkan:${lwjgl_version}")
    testImplementation("org.lwjgl:lwjgl-vulkan:${lwjgl_version}")
}

test {
    failOnNoDiscoveredTests = false
}

tasks.register('checkTextMarquee', JavaExec) {
    group = 'verification'
    description = 'Checks continuous text movement, filtering and Canvas cache reuse without a GPU.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.TextMarqueeCheck'
    systemProperty 'modernui.projectRoot', rootProject.projectDir.absolutePath
}

check.dependsOn checkTextMarquee

// A task-backed source directory also supplies the dependency to loader compiles,
// which compile the common sources directly.
def generateFontVariant = tasks.register('generateFontVariant') {
    def output = layout.buildDirectory.dir('generated/sources/fontVariant/java')
    inputs.property('fontVariant', rootProject.fontVariant)
    inputs.property('displayName', rootProject.fontVariantDisplayName)
    outputs.dir(output)
    doLast {
        def target = output.get().file('icyllis/modernui/mc/FontVariant.java').asFile
        target.parentFile.mkdirs()
        target.text = """package icyllis.modernui.mc;

/** Build-time edition; never selected by a runtime property or config file. */
public final class FontVariant {
    public static final boolean MISANS = ${rootProject.fontVariant == 'misans'};
    public static final String NAME = "${rootProject.fontVariant}";
    public static final String DISPLAY_NAME = "${rootProject.fontVariantDisplayName}";
    public static final String CLIENT_CONFIG_NAME = "client-${rootProject.fontVariant}.toml";
    private FontVariant() {}
}
"""
    }
}
sourceSets.main.java.srcDir(generateFontVariant)

tasks.register('checkFontVariant', JavaExec) {
    group = 'verification'
    description = 'Checks font defaults, legacy configuration isolation and compiled edition boundaries.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.FontVariantCheck'
}
check.dependsOn checkFontVariant

['PreferredFontIdentifier', 'GlfwInput', 'ClampingScrollView', 'LwjglAbi', 'VulkanContextLifecycle', 'SpirvArrayLayout', 'EffectTextureOwnership', 'SoundVolumeApi', 'VulkanRenderArea'].each { checkName ->
    def checkTask = tasks.register("check${checkName}", JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "icyllis.modernui.mc.test.${checkName}Check"
    }
    check.dependsOn checkTask
}

// Verify optional backend injection targets without putting either mod on the game classpath.
configurations { vulkanApiAudit }
dependencies {
    vulkanApiAudit("maven.modrinth:vulkanmod:2eqroDKD") { transitive = false }
    vulkanApiAudit("maven.modrinth:vulkanmod-reforged:qsEMQHT9") { transitive = false }
}
['VulkanDepthBarrier', 'VulkanSurface', 'VulkanBridgeApi'].each { checkName ->
    def checkTask = tasks.register("check${checkName}", JavaExec) {
        group = 'verification'
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "icyllis.modernui.mc.test.${checkName}Check"
        doFirst { setArgs(configurations.vulkanApiAudit.files.collect { it.absolutePath }) }
    }
    check.dependsOn checkTask
}

// Executes the actual 1.21/1.21.1 Window transition without invoking native rendering.
tasks.register('checkWindowModeTransition', JavaExec) {
    group = 'verification'
    dependsOn testClasses, ':ModernUI-Fabric:compileJava', ':ModernUI-NeoForge:compileJava'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.WindowModeTransitionCheck'
    workingDir rootProject.projectDir
    if (project.hasProperty('window_mode_target')) {
        args project.property('window_mode_target')
    }
}
check.dependsOn checkWindowModeTransition

// Verifies the NeoForge renderer before mod construction, with native boundaries replaced.
tasks.register('checkVulkanBootstrap', JavaExec) {
    group = 'verification'
    dependsOn testClasses, ':ModernUI-NeoForge:compileJava'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.VulkanBootstrapCheck'
    workingDir rootProject.projectDir
}
check.dependsOn checkVulkanBootstrap

// Runs the compiled upload completion method against both releases' queue contracts.
tasks.register('checkVulkanUploadSynchronization', JavaExec) {
    group = 'verification'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.VulkanUploadSynchronizationCheck'
    workingDir rootProject.projectDir
    if (project.hasProperty('vulkan_upload_negative_jar')) {
        args project.property('vulkan_upload_negative_jar')
    }
}
check.dependsOn checkVulkanUploadSynchronization

// Matches UI completion to Reforged's acquired-frame GameRenderer invocation.
tasks.register('checkVulkanFrameLifecycle', JavaExec) {
    group = 'verification'
    dependsOn testClasses, ':ModernUI-NeoForge:compileJava'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.VulkanFrameLifecycleCheck'
    workingDir rootProject.projectDir
    if (project.hasProperty('vulkan_frame_negative_jar')) {
        args project.property('vulkan_frame_negative_jar')
    }
}
check.dependsOn checkVulkanFrameLifecycle

tasks.register('checkVulkanTextShaderPreload', JavaExec) {
    group = 'verification'
    dependsOn testClasses, ':ModernUI-NeoForge:compileJava'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'icyllis.modernui.mc.test.VulkanTextShaderPreloadCheck'
    workingDir rootProject.projectDir
    doFirst {
        def arguments = configurations.vulkanApiAudit.files.collect { it.absolutePath }
        if (project.hasProperty('vulkan_text_negative_jar')) {
            arguments.add(project.property('vulkan_text_negative_jar'))
        }
        setArgs(arguments)
    }
}
check.dependsOn checkVulkanTextShaderPreload
